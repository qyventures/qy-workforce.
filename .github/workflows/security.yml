name: Security baseline

# Security validation runs on proposed changes before merge. The same suite is
# not repeated automatically after merge to main, avoiding duplicate hosted
# runner usage. workflow_dispatch remains available for release/security checks.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Semgrep application and database code
        run: |
          python -m pip install --disable-pip-version-check 'semgrep>=1.90,<2'
          semgrep scan --config p/owasp-top-ten --config p/secrets --error --exclude '.github/workflows/**' apps supabase

  sql-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject obvious unsafe migration patterns
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'disable row level security|grant all .* to (anon|authenticated|service_role)' supabase/migrations || {
            echo 'Potentially unsafe database privilege pattern found.' >&2
            exit 1
          }
          echo 'SQL privilege guard passed.'

  workforce-security-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assert critical workforce security boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pg_advisory_xact_lock' supabase/migrations/0018_shift_acceptance_conflict_controls.sql
          grep -q 'for update' supabase/migrations/0018_shift_acceptance_conflict_controls.sql
          grep -q 'worker_has_deployment_prerequisites' supabase/migrations/0019_live_deployability_guard.sql
          grep -q "purpose = 'location_clocking'" supabase/migrations/0019_live_deployability_guard.sql
          grep -q 'self-review not permitted' supabase/migrations/0020_ops_worker_review_controls.sql
          grep -q 'revoke update on public.worker_profiles from authenticated' supabase/migrations/0020_ops_worker_review_controls.sql
          grep -q 'revoke insert, update, delete on public.worker_roles from authenticated' supabase/migrations/0020_ops_worker_review_controls.sql
          grep -q 'revoke insert, update, delete on public.worker_vetting from authenticated' supabase/migrations/0020_ops_worker_review_controls.sql
          test -f supabase/tests/worker_review_security_checks.sql
          if test -f supabase/migrations/0022_retention_enforcement.sql; then
            grep -q "v_role <> 'admin'" supabase/migrations/0022_retention_enforcement.sql
            grep -q "auth.role() = 'service_role'" supabase/migrations/0022_retention_enforcement.sql
            grep -q 'retention_hold=true' <(tr -d ' ' < supabase/migrations/0022_retention_enforcement.sql)
            grep -q 'latitude=null' <(tr -d ' ' < supabase/migrations/0022_retention_enforcement.sql)
            grep -q 'device_fingerprint_hash=null' <(tr -d ' ' < supabase/migrations/0022_retention_enforcement.sql)
            grep -q 'provider_subject_hash=null' <(tr -d ' ' < supabase/migrations/0022_retention_enforcement.sql)
            grep -q 'revoke all on function public.run_retention_maintenance(boolean,integer) from public' supabase/migrations/0022_retention_enforcement.sql
            test -f supabase/tests/retention_security_checks.sql
          fi
          if test -f supabase/migrations/0024_audit_metadata_minimisation.sql; then
            grep -q "'nric'" supabase/migrations/0024_audit_metadata_minimisation.sql
            grep -q "'access_token'" supabase/migrations/0024_audit_metadata_minimisation.sql
            grep -q 'audit_metadata_minimisation_guard' supabase/migrations/0024_audit_metadata_minimisation.sql
            grep -q 'revoke all on function public.audit_metadata_contains_sensitive_keys(jsonb) from anon, authenticated' supabase/migrations/0024_audit_metadata_minimisation.sql
            grep -q 'revoke all on function public.enforce_audit_metadata_minimisation() from anon, authenticated' supabase/migrations/0024_audit_metadata_minimisation.sql
            test -f supabase/tests/audit_metadata_minimisation_checks.sql
          fi
          if test -f supabase/migrations/0025_site_geofence_change_control.sql; then
            grep -q 'sites_geofence_change_guard' supabase/migrations/0025_site_geofence_change_control.sql
            grep -q 'public.is_ops()' supabase/migrations/0025_site_geofence_change_control.sql
            grep -q 'change reason required' supabase/migrations/0025_site_geofence_change_control.sql
            grep -q 'site.geofence_changed' supabase/migrations/0025_site_geofence_change_control.sql
            grep -q 'revoke all on function public.update_site_geofence(uuid,numeric,numeric,integer,text) from public' supabase/migrations/0025_site_geofence_change_control.sql
            test -f supabase/tests/site_geofence_change_control_checks.sql
          fi
          echo 'Critical workforce security invariants present.'
