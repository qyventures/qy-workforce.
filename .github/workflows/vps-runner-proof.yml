name: VPS Runner Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/run-vps-proof.txt'
      - '.github/workflows/vps-runner-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Capture runner proof
        shell: bash
        run: |
          {
            echo "timestamp=$(date --iso-8601=seconds)"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            uptime
            free -h
            df -h /
            pgrep -af 'Runner.Worker|node|npm|python|gradle|codex' || true
          } > /tmp/qy-workforce-vps-proof.txt
          cat /tmp/qy-workforce-vps-proof.txt
      - name: Publish runner proof
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/vps-runner-proof.txt';
            const content = Buffer.from(fs.readFileSync('/tmp/qy-workforce-vps-proof.txt')).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              sha = existing.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'chore: publish workforce VPS runner proof', content, branch: 'main', ...(sha ? {sha} : {})});
