name: Mobile Branch CI

on:
  push:
    branches: [agent/mobile]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-branch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
